<!DOCTYPE html>

<html lang="et">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Sünnipäevakutse (300 × 500 mm)</title>

<style>

{
box-sizing: border-box;

margin: 0;

padding: 0;

}



body {

min-height: 100vh;

display: flex;

justify-content: center;

align-items: center;

background-color: #e5e5e0;

padding: 20px;

font-family: 'Georgia', serif;

}



.invite-card {

width: 300mm;

height: 500mm;

background-color: #eedce0;

padding: 46mm 38mm;

display: flex;

justify-content: center;

align-items: center;

box-shadow: 0 22px 48px rgba(0, 0, 0, 0.22);

}



.inner-box {

width: 100%;

height: 100%;

background-color: #d7b7bf;

border: 1.5px solid #9f6a77;

padding: 20mm 18mm;

display: flex;

justify-content: center;

align-items: center;

}



.archway {

position: relative;

width: 100%;

height: 100%;

background-color: #eedce0;

border: 1.5px solid #9f6a77;

border-radius: 94mm 94mm 0 0;

overflow: visible;

display: flex;

flex-direction: column;

justify-content: space-between;

align-items: center;

padding: 45mm 18mm 75mm;

text-align: center;

color: #5c2b3a;

}



.flowers-row {

position: absolute;

bottom: 2mm;

left: -10mm;

right: -10mm;

display: flex;

justify-content: space-between;

align-items: flex-end;

z-index: 2;

pointer-events: none;

}



.flower-item {

width: 66mm;

height: auto;

}

</style>

</head>

<body>



<div class="invite-card">

<div class="inner-box">

<div class="archway">



<div class="flowers-row">

<img src="lill.png" alt="" class="flower-item" />

<img src="lill.png" alt="" class="flower-item" />

<img src="lill.png" alt="" class="flower-item" />

</div>



</div>

</div>

</div>



</body>

</html>
